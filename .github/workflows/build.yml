name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release (tag v<VERSION>) with the built binaries"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: "0.3.2"
  VST3SDK_TAG: v3.8.1_build_84
  ARTEFACTS: build/OrbitEcho_artefacts/Release
  PRODUCT: Orbit Echo

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC 2022 is required; as of late 2026 windows-latest ships a newer
          # Visual Studio only, so the job pins the image that includes VS 2022.
          - name: Windows
            os: windows-2022
            generator: '-G "Visual Studio 17 2022" -A x64'
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: ./pluginval/pluginval.exe
            clap_validator_archive: clap-validator-0.3.2-windows.zip
            clap_validator_bin: ./clap-validator/clap-validator.exe
            vst3_validator_bin: vst3sdk/build/bin/Release/validator.exe
          - name: macOS
            os: macos-latest
            generator: "-G Ninja"
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: ./pluginval/pluginval.app/Contents/MacOS/pluginval
            clap_validator_archive: clap-validator-0.3.2-macos-universal.tar.gz
            clap_validator_bin: ./clap-validator/binaries/clap-validator
            vst3_validator_bin: vst3sdk/build/bin/Release/validator
          - name: Linux
            os: ubuntu-24.04
            generator: "-G Ninja"
            pluginval_zip: pluginval_Linux.zip
            pluginval_bin: ./pluginval/pluginval
            clap_validator_archive: clap-validator-0.3.2-ubuntu-18.04.tar.gz
            clap_validator_bin: ./clap-validator/clap-validator
            vst3_validator_bin: vst3sdk/build/bin/Release/validator

    steps:
      - name: Checkout (with JUCE and CLAP submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev \
            libfontconfig1-dev libgl-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        shell: bash
        run: >
          cmake -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DOE_BUILD_TESTS=ON -DOE_BUILD_TOOLS=ON
          -DOE_COPY_AFTER_BUILD=OFF -DOE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Ad-hoc code signing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for b in "$ARTEFACTS/VST3/$PRODUCT.vst3" "$ARTEFACTS/AU/$PRODUCT.component" \
                   "$ARTEFACTS/CLAP/$PRODUCT.clap" "$ARTEFACTS/Standalone/$PRODUCT.app"; do
            codesign --force --deep -s - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done
          lipo -info "$ARTEFACTS/VST3/$PRODUCT.vst3/Contents/MacOS/$PRODUCT"

      - name: Run tests
        shell: bash
        run: |
          RUN=""
          if [ "$RUNNER_OS" == "Linux" ]; then RUN="xvfb-run -a"; fi
          $RUN ctest --test-dir build -C $BUILD_TYPE --output-on-failure

      - name: Check the Windows binaries have no dynamic MSVC runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bins = @(
            (Get-ChildItem -Recurse -File -Filter "*.vst3" "${env:ARTEFACTS}/VST3/${env:PRODUCT}.vst3" | Select-Object -First 1).FullName,
            "${env:ARTEFACTS}/CLAP/${env:PRODUCT}.clap")
          foreach ($bin in $bins) {
            $deps = & $dumpbin /dependents $bin | Out-String
            Write-Output $deps
            if ($deps -match "(?i)(vcruntime|msvcp|api-ms-win-crt)") { throw "$bin depends on the dynamic MSVC runtime" }
          }

      # ---------------------------------------------------------------------
      # Validators
      # ---------------------------------------------------------------------
      - name: Download pluginval and clap-validator
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
          mkdir -p pluginval && unzip -q pluginval.zip -d pluginval
          curl -sSfL -o cv.archive "https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/${{ matrix.clap_validator_archive }}"
          mkdir -p clap-validator
          case "${{ matrix.clap_validator_archive }}" in
            *.zip) unzip -q cv.archive -d clap-validator ;;
            *) tar xzf cv.archive -C clap-validator ;;
          esac
          find clap-validator -type f | head

      - name: Cache Steinberg VST3 validator
        id: vst3cache
        uses: actions/cache@v4
        with:
          path: vst3sdk/build/bin
          key: vst3-validator-${{ runner.os }}-${{ env.VST3SDK_TAG }}-v2

      - name: Build Steinberg VST3 validator
        if: steps.vst3cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone -q --depth 1 --branch "$VST3SDK_TAG" https://github.com/steinbergmedia/vst3sdk.git vst3sdk-src
          git -C vst3sdk-src submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S vst3sdk-src -B vst3sdk/build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF \
            -DCMAKE_OSX_ARCHITECTURES=""
          cmake --build vst3sdk/build --config Release --target validator --parallel 4

      - name: Steinberg VST3 validator
        shell: bash
        run: ${{ matrix.vst3_validator_bin }} "$ARTEFACTS/VST3/$PRODUCT.vst3"

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          RUN=""
          if [ "$RUNNER_OS" == "Linux" ]; then RUN="xvfb-run -a"; fi
          $RUN ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process \
            --timeout-ms 900000 --output-dir pluginval-logs "$ARTEFACTS/VST3/$PRODUCT.vst3"

      - name: clap-validator (CLAP)
        shell: bash
        run: ${{ matrix.clap_validator_bin }} validate "$ARTEFACTS/CLAP/$PRODUCT.clap"

      - name: auval + pluginval (AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Alej" || true
          auval -strict -v aufx Orbe Alej
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process \
            --timeout-ms 900000 --output-dir pluginval-logs ~/Library/Audio/Plug-Ins/Components/"$PRODUCT.component"

      - name: Host harness (loads the built binaries like a DAW)
        shell: bash
        run: |
          H=$(find build -type f \( -name "oe_host_harness" -o -name "oe_host_harness.exe" \) -perm -u+x 2>/dev/null | head -1)
          if [ -z "$H" ]; then H=$(find build -type f -name "oe_host_harness.exe" | head -1); fi
          if [ -z "$H" ]; then echo "host harness not built yet"; exit 0; fi
          RUN=""
          if [ "$RUNNER_OS" == "Linux" ]; then RUN="xvfb-run -a"; fi
          $RUN "$H" "$ARTEFACTS/VST3/$PRODUCT.vst3"
          if [ "$RUNNER_OS" == "macOS" ]; then "$H" ~/Library/Audio/Plug-Ins/Components/"$PRODUCT.component"; fi

      # ---------------------------------------------------------------------
      # Packaging
      # ---------------------------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "${env:ARTEFACTS}/VST3/${env:PRODUCT}.vst3" -DestinationPath dist/OrbitEcho-Windows-VST3.zip
          Compress-Archive -Path "${env:ARTEFACTS}/CLAP/${env:PRODUCT}.clap" -DestinationPath dist/OrbitEcho-Windows-CLAP.zip
          Compress-Archive -Path "${env:ARTEFACTS}/Standalone/${env:PRODUCT}.exe" -DestinationPath dist/OrbitEcho-Windows-Standalone.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$ARTEFACTS/VST3/$PRODUCT.vst3" dist/OrbitEcho-macOS-VST3.zip
          ditto -c -k --keepParent "$ARTEFACTS/AU/$PRODUCT.component" dist/OrbitEcho-macOS-AU.zip
          ditto -c -k --keepParent "$ARTEFACTS/CLAP/$PRODUCT.clap" dist/OrbitEcho-macOS-CLAP.zip
          ditto -c -k --keepParent "$ARTEFACTS/Standalone/$PRODUCT.app" dist/OrbitEcho-macOS-Standalone.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          (cd "$ARTEFACTS/VST3" && zip -qr "$GITHUB_WORKSPACE/dist/OrbitEcho-Linux-VST3.zip" "$PRODUCT.vst3")
          (cd "$ARTEFACTS/CLAP" && zip -qr "$GITHUB_WORKSPACE/dist/OrbitEcho-Linux-CLAP.zip" "$PRODUCT.clap")

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitEcho-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload validator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: OrbitEcho-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Orbit Echo ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: dist/*.zip
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
